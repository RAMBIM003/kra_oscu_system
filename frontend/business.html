<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Businesses - KRA eTIMS</title>

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/business.css">
</head>

<body>

<section
    id="business-screen"
    class="page-screen"
>

    <header class="selection-header">

        <div class="selection-brand">

            <div class="selection-logo">
                K
            </div>

            <div>
                <strong>KRA eTIMS</strong>
                <span>Management Platform</span>
            </div>

        </div>


        <div class="selection-user">

            <div class="user-avatar">
                <i class="ph ph-user"></i>
            </div>

            <div class="user-info">

                <span>Profile</span>

                <strong id="business-profile-label">
                    —
                </strong>

            </div>

            <button
                id="business-logout"
                class="icon-btn"
                title="Sign out"
            >
                <i class="ph ph-sign-out"></i>
            </button>

        </div>

    </header>


    <main class="selection-main">

        <div class="selection-heading">

            <div>

                <span class="eyebrow">
                    BUSINESS
                </span>

                <h1>
                    Select a business
                </h1>

                <p>
                    Choose the business you want to
                    manage through the eTIMS platform.
                </p>

            </div>

            <button
                id="open-create-business"
                class="btn btn-primary"
            >
                <i class="ph ph-plus"></i>
                Add Business
            </button>

        </div>


        <div
            id="businesses-list"
            class="cards-grid"
        ></div>

    </main>

</section>


<div
    id="business-modal"
    class="modal hidden"
>

    <div class="modal-dialog modal-dialog-large">

        <div class="modal-header">

            <div>

                <span class="eyebrow">
                    BUSINESS
                </span>

                <h2>
                    Add business
                </h2>

                <p>
                    Connect a business to the active profile.
                </p>

            </div>

            <button
                class="close-modal icon-btn"
                data-modal="business-modal"
                type="button"
            >
                <i class="ph ph-x"></i>
            </button>

        </div>


        <form id="business-form">

            <div class="modal-body">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="business-name">
                            Business name
                        </label>

                        <div class="input-wrapper">

                            <i class="ph ph-buildings input-icon"></i>

                            <input
                                type="text"
                                id="business-name"
                                placeholder="Business name"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="business-kra-pin">
                            KRA PIN
                        </label>

                        <div class="input-wrapper">

                            <i class="ph ph-identification-card input-icon"></i>

                            <input
                                type="text"
                                id="business-kra-pin"
                                placeholder="P000000000X"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="business-branch-id">
                            Branch ID
                        </label>

                        <div class="input-wrapper">

                            <i class="ph ph-git-branch input-icon"></i>

                            <input
                                type="text"
                                id="business-branch-id"
                                placeholder="Branch ID"
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="business-device-serial">
                            Device Serial
                        </label>

                        <div class="input-wrapper">

                            <i class="ph ph-device-mobile input-icon"></i>

                            <input
                                type="text"
                                id="business-device-serial"
                                placeholder="Device serial number"
                            >

                        </div>

                    </div>


                    <div class="form-group form-grid-full">

                        <label for="business-cmc-key">
                            CMC Key
                        </label>

                        <div class="input-wrapper">

                            <i class="ph ph-key input-icon"></i>

                            <input
                                type="password"
                                id="business-cmc-key"
                                placeholder="Enter CMC key"
                                required
                            >

                        </div>

                        <small class="field-help">
                            Your CMC key is used for the secure
                            KRA eTIMS integration.
                        </small>

                    </div>

                </div>


                <div
                    id="business-form-message"
                    class="auth-message"
                ></div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary close-modal"
                    data-modal="business-modal"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    <i class="ph ph-plugs-connected"></i>
                    Connect Business
                </button>

            </div>

        </form>

    </div>

</div>


<script src="/js/auth.js"></script>
<script src="/js/profiles.js"></script>
<script src="/js/business.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/items.js"></script>
<script src="/js/purchases.js"></script>
<script src="/js/sales.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
